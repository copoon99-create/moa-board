<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모아게시판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#17181c; --muted:#6b7079; --faint:#9aa0a8; --line:#e8eaee; --soft:#f1f2f5;
  --accent:#4f5bd5; --accent-fg:#ffffff;
  --dc:#4659c8; --fm:#2f7de1; --mlb:#e0533d; --yt:#ff0033; --naver:#03a94d; --ok:#14935a;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --r:18px;
  --body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f12; --card:#17191d; --fg:#eceef1; --muted:#9a9fa8; --faint:#6c717a; --line:#25282e; --soft:#1e2126;
  --accent:#8b93ff; --accent-fg:#0e0f12;
  --dc:#8f9cff; --fm:#6aa8ff; --mlb:#ff8a73; --yt:#ff4d6a; --naver:#2fd27a; --ok:#3ccf8e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12; --card:#17191d; --fg:#eceef1; --muted:#9a9fa8; --faint:#6c717a; --line:#25282e; --soft:#1e2126;
  --accent:#8b93ff; --accent-fg:#0e0f12;
  --dc:#8f9cff; --fm:#6aa8ff; --mlb:#ff8a73; --yt:#ff4d6a; --naver:#2fd27a; --ok:#3ccf8e;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:14px}

/* 상단 */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 -16px;padding:14px 16px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}

/* 공통 버튼 */
.btn{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--soft);color:var(--fg);border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:color-mix(in srgb,var(--accent) 12%,var(--soft))}
.btn:active{transform:scale(.97)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 카드(섹션) */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
h2{font-size:15px;font-weight:700;margin:0;letter-spacing:-.02em}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* 목록 공통 */
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center}
li a{flex:1;min-width:0;display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.chip{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.name{font-weight:600;font-size:15px}
.url{color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-left:auto;color:var(--faint);flex:none;font-size:18px}

/* 바로가기: 앱 아이콘 격자 */
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px 4px}
.shortcuts li{flex-direction:column;align-items:stretch}
.shortcuts li a{flex-direction:column;gap:7px;padding:8px 2px;border-radius:14px;text-align:center;transition:background .15s}
.shortcuts li a:hover{background:var(--soft)}
.shortcuts .chip{width:48px;height:48px;border-radius:15px;font-size:15px}
.shortcuts .name{font-size:12px;font-weight:500;line-height:1.3;word-break:keep-all;color:var(--fg)}

/* 게시판 목록 */
#list li{border-top:1px solid var(--line)}
#list li:first-child{border-top:0}
#list li a{padding:11px 2px}

/* 편집 */
.ctrl{display:flex;gap:4px;flex:none;padding:2px 0}
.shortcuts .ctrl{justify-content:center;padding:0 0 6px}
.ctrl button{font:inherit;font-size:12px;border:0;background:var(--soft);color:var(--fg);border-radius:8px;padding:5px 8px;cursor:pointer}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl .x{color:var(--mlb)}
form{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
form input,form select{flex:1 1 180px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
form select{flex:0 0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* 전자책 찾기 */
.esearch{display:flex;align-items:center;gap:0;background:var(--soft);border:1px solid transparent;border-radius:999px;padding:4px 4px 4px 16px;box-shadow:none;transition:border-color .15s,background .15s}
.esearch:focus-within{border-color:var(--accent);background:var(--card)}
.esearch input{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 0;border:0;background:none;color:var(--fg);outline:none}
.esearch input::placeholder{color:var(--faint)}
.esearch .btn{flex:none;background:var(--accent);color:var(--accent-fg);padding:9px 18px}
.esearch .btn:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.libs{display:flex;flex-direction:column}
.libs li{flex-direction:column;align-items:stretch;padding:12px 0;gap:6px;border-top:1px solid var(--line)}
.libs li:first-child{border-top:0;padding-top:4px}
.libs .lh{display:flex;align-items:center;gap:8px}
.libs .ln{font-weight:600;font-size:14px}
.libs .st{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.libs .open{flex:none;margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.libs .bk{display:block;font-size:14px;line-height:1.45;padding-left:2px}
.libs .bk:hover{text-decoration:underline}
.libs .bk small{color:var(--muted);font-size:12px}

/* 최근 글 */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-size:13px;font-weight:600;border:0;background:var(--soft);color:var(--muted);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--fg)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--card)}
.feed li{border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed li a{gap:10px;padding:12px 2px;align-items:flex-start;border-radius:10px}
.feed li a:hover .title{color:var(--accent)}
.feed .badge{flex:none;min-width:3.4em;text-align:center;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:7px;padding:3px 6px;margin-top:1px}
.feed .title{font-size:15px;line-height:1.45;word-break:break-all;transition:color .15s}
.feed .cm{color:var(--accent);font-weight:700;font-size:13px}
.feed .meta{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.empty{border-radius:14px;background:var(--soft);padding:22px 16px;color:var(--muted);font-size:14px;line-height:1.6;text-align:center}
.updated{color:var(--faint);font-size:12px;margin:-4px 0 0}
.more{align-self:center}
.refresh{display:inline-flex;align-items:center;gap:6px}
.refresh[disabled]{opacity:.6;cursor:default}
.refresh[disabled] .spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.refresh[disabled] .spin{animation:none}}
.note{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.note a{color:var(--accent);font-weight:600}
.foot{color:var(--faint);font-size:12px;text-align:center;margin-top:4px}
@media (max-width:420px){.panel{padding:16px 14px 14px}.shortcuts{grid-template-columns:repeat(4,1fr)}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>모아게시판</h1>
      <p class="sub">바로가기 <span id="scount">9</span>곳 · 게시판 <span id="count">6</span>곳</p>
    </div>
    <button class="btn" id="editBtn" type="button">편집</button>
  </header>

  <section class="panel">
    <h2>바로가기</h2>
    <ul class="shortcuts" id="slist"></ul>
  </section>

  <section class="panel">
    <h2>전자책 찾기</h2>
    <form class="esearch" id="ebookForm" role="search">
      <input id="ebookQ" type="search" placeholder="책 제목으로 6곳 한 번에 찾기" aria-label="책 제목" required>
      <button class="btn" type="submit">찾기</button>
    </form>
    <ul class="libs" id="libs" hidden></ul>
  </section>

  <section class="panel">
    <div class="phead">
      <h2>최근 글</h2>
      <button class="btn refresh" id="refreshBtn" type="button"><span class="spin" aria-hidden="true">↻</span><span id="refreshLabel">새로고침</span></button>
    </div>
    <p class="note" id="refreshNote" hidden></p>
    <div class="tabs" id="tabs" role="toolbar" aria-label="게시판 고르기"></div>
    <p class="updated" id="updated" hidden></p>
    <p class="note" id="feedErr" hidden></p>
    <ul class="feed" id="feed" hidden></ul>
    <div class="empty" id="feedEmpty">게시판에서 최신 글을 불러오는 중이에요.</div>
    <button class="btn more" id="moreBtn" type="button" hidden>더 보기</button>
  </section>

  <section class="panel">
    <h2>게시판</h2>
    <ul id="list"></ul>
  </section>

  <form id="addForm" hidden>
    <select id="newKind" aria-label="넣을 곳"><option value="boards">게시판</option><option value="shortcuts">바로가기</option></select>
    <input id="newName" placeholder="이름" required>
    <input id="newUrl" placeholder="https://..." type="url" required>
    <div class="row">
      <button class="btn" type="submit">추가</button>
      <button class="btn" type="button" id="resetBtn">처음 목록으로 되돌리기</button>
    </div>
  </form>

  <p class="foot">편집한 내용은 이 기기 브라우저에만 저장돼요.</p>
</div>

<script>
const DEFAULTS={
 shortcuts:[
  {name:"유튜브",url:"https://www.youtube.com/"},
  {name:"X",url:"https://x.com/"},
  {name:"우리의 식탁",url:"https://claude.ai/artifact/NvnyNs6LDAppHWA79MrQ1z"},
  {name:"스냅 덱",url:"https://snapcomplete.com/play/matches/decks"},
  {name:"PGR21",url:"https://www.pgr21.com/"},
  {name:"네이버 카페",url:"https://section.cafe.naver.com/ca-fe/home",app:"navercafe"},
  {name:"법무부 전자도서관",url:"https://moj.yes24library.com/default.asp"},
  {name:"수원시 도서관",url:"https://mob.suwonlib.go.kr/"},
  {name:"나라배움터 도서관",url:"https://ebook-nhi.mlss.co.kr/Kyobo_T3_Mobile/Web/Main/Ebook_Main.asp"}
 ],
 boards:[
  {name:"부동산",url:"https://m.fmkorea.com/realestate"},
  {name:"마블 스냅 갤러리",url:"https://m.dcinside.com/board/marvelsnap"},
  {name:"보호직 갤러리",url:"https://m.dcinside.com/board/bh"},
  {name:"특이점이 온다 갤러리",url:"https://m.dcinside.com/board/thesingularity"},
  {name:"불펜",url:"https://mlbpark.donga.com/mp/b.php?b=bullpen"},
  {name:"AI 활용 갤러리",url:"https://m.dcinside.com/board/ai_utilize"}
 ]};
const KEY="moa-board-v2";
const clone=()=>JSON.parse(JSON.stringify(DEFAULTS));
let data=load(), editing=false;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.boards)&&Array.isArray(s.shortcuts)){
  for(const x of s.shortcuts){if(x.url.includes("Kyobo_T3/Default.asp"))x.url="https://ebook-nhi.mlss.co.kr/Kyobo_T3_Mobile/Web/Main/Ebook_Main.asp"}
  for(const x of s.shortcuts){if(x.url.includes("cafe.naver.com"))x.app="navercafe"}
  for(const x of s.shortcuts) if(x.url.includes("our-table-kitchen")){x.name="우리의 식탁";x.url="https://claude.ai/artifact/NvnyNs6LDAppHWA79MrQ1z"}
  return s}}catch(e){}return clone()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const SITES=[["dcinside","디시","var(--dc)"],["fmkorea","펨코","var(--fm)"],["mlbpark","엠팍","var(--mlb)"],["youtube","▶","var(--yt)"],["x.com","X","var(--fg)"],["naver","N","var(--naver)"],["pgr21","P","var(--fm)"],["snapcomplete","S","var(--dc)"]];
function site(u,name){
  for(const [k,t,c] of SITES) if(u.includes(k)) return{t,c};
  return{t:(name||"?").trim()[0].toUpperCase(),c:"var(--accent)"};
}
function item(kind,b,i,arr){
  const s=site(b.url,b.name),li=document.createElement("li"),a=document.createElement("a");
  a.href=b.url;a.target="_blank";a.rel="noopener";
  if(b.app==="navercafe"){ /* 휴대폰에서만 네이버 카페 앱으로 열기. 노트북·PC는 웹사이트 그대로 */
    const ua=navigator.userAgent;
    const ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
    if(/Android/i.test(ua)){
      a.href="intent://#Intent;scheme=navercafe;package=com.nhn.android.navercafe;S.browser_fallback_url="+encodeURIComponent(b.url)+";end";
      a.removeAttribute("target");
    }else if(ios){a.href="navercafe://";a.removeAttribute("target")}
  }
  a.innerHTML=kind==="boards"
    ?'<span class="chip"></span><span class="txt"><span class="name"></span><span class="url"></span></span><span class="go">›</span>'
    :'<span class="chip"></span><span class="name"></span>';
  const chip=a.querySelector(".chip");chip.textContent=s.t;chip.style.setProperty("--c",s.c);
  a.querySelector(".name").textContent=b.name;
  const u=a.querySelector(".url"); if(u)u.textContent=b.url.replace(/^https?:\/\//,"");
  li.appendChild(a);
  if(editing){
    const c=document.createElement("div");c.className="ctrl";
    const mk=(t,lab,fn,dis,cls)=>{const x=document.createElement("button");x.type="button";x.textContent=t;x.setAttribute("aria-label",lab);x.disabled=dis;if(cls)x.className=cls;x.onclick=fn;c.appendChild(x)};
    const mv=d=>{[arr[i],arr[i+d]]=[arr[i+d],arr[i]];save();render()};
    mk("↑",b.name+" 위로",()=>mv(-1),i===0);
    mk("↓",b.name+" 아래로",()=>mv(1),i===arr.length-1);
    mk("삭제",b.name+" 삭제",()=>{arr.splice(i,1);save();render()},false,"x");
    li.appendChild(c);
  }
  return li;
}
function render(){
  for(const [kind,id] of [["shortcuts","slist"],["boards","list"]]){
    const ul=document.getElementById(id);ul.innerHTML="";
    data[kind].forEach((b,i,arr)=>ul.appendChild(item(kind,b,i,arr)));
  }
  document.getElementById("count").textContent=data.boards.length;
  document.getElementById("scount").textContent=data.shortcuts.length;
  document.getElementById("addForm").hidden=!editing;
  document.getElementById("editBtn").textContent=editing?"완료":"편집";
}
document.getElementById("editBtn").onclick=()=>{editing=!editing;render()};
document.getElementById("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const k=document.getElementById("newKind").value,n=document.getElementById("newName"),u=document.getElementById("newUrl");
  data[k].push({name:n.value.trim(),url:u.value.trim()});n.value="";u.value="";save();render();
});
document.getElementById("resetBtn").onclick=()=>{data=clone();save();render()};
render();

/* 최근 글: posts.json(30분마다 GitHub Actions가 갱신)을 모아 시간순으로 */
let feedDocs=[], tab="all", shown=Infinity;
function ago(iso){
  const t=Date.parse(iso); if(!t) return "";
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return "방금"; if(m<60) return m+"분 전";
  const h=Math.floor(m/60); if(h<24) return h+"시간 전";
  const d=new Date(t); return (d.getMonth()+1)+"."+d.getDate();
}
function short(n){return (n||"").replace(/갤러리|\s/g,"").slice(0,3)}
function renderFeed(){
  const tabs=document.getElementById("tabs"); tabs.innerHTML="";
  const all=[["all","전체"]].concat(feedDocs.map(d=>[d.id,d.name||d.id]));
  for(const [k,n] of all){const b=document.createElement("button");b.type="button";b.className="tab";b.textContent=n;
    b.setAttribute("aria-pressed",String(tab===k));b.onclick=()=>{tab=k;renderFeed()};tabs.appendChild(b)}
  let posts=[];
  // 전체 보기는 모든 게시판의 글을 전부 시간순으로 보여준다
  for(const d of feedDocs) if(tab==="all"||tab===d.id){
    const own=(d.posts||[]).slice().sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));
    for(const p of own) posts.push(Object.assign({board:d.name||d.id,boardUrl:d.url||""},p));
  }
  posts.sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));
  const ul=document.getElementById("feed"); ul.innerHTML="";
  posts.slice(0,shown).forEach(p=>{
    const s=site(p.boardUrl||p.url,p.board),li=document.createElement("li"),a=document.createElement("a");
    a.href=p.url;a.target="_blank";a.rel="noopener";
    a.innerHTML='<span class="badge"></span><span class="txt"><span class="title"></span><span class="meta"></span></span>';
    const bd=a.querySelector(".badge");bd.textContent=short(p.board);bd.style.setProperty("--c",s.c);bd.title=p.board;
    const ti=a.querySelector(".title");ti.textContent=p.title;
    if(p.comments){const c=document.createElement("span");c.className="cm";c.textContent=" ["+p.comments+"]";ti.appendChild(c)}
    a.querySelector(".meta").textContent=[p.board,p.author,ago(p.time)].filter(Boolean).join(" · ");
    li.appendChild(a);ul.appendChild(li);
  });
  ul.hidden=!posts.length;
  document.getElementById("feedEmpty").hidden=!!posts.length;
  document.getElementById("moreBtn").hidden=posts.length<=shown;
  const errs=feedDocs.filter(d=>d.error).map(d=>(d.name||d.id)+" ("+d.error+")");
  const fe=document.getElementById("feedErr"); fe.hidden=!errs.length; fe.textContent=errs.length?"불러오지 못한 게시판: "+errs.join(", "):"";
  tabs.hidden=!feedDocs.length;
  const up=feedDocs.map(d=>Date.parse(d.updatedAt)||0).reduce((a,b)=>Math.max(a,b),0);
  const ue=document.getElementById("updated"); ue.hidden=!up; if(up) ue.textContent="마지막으로 모은 시각: "+ago(new Date(up).toISOString());
}
document.getElementById("moreBtn").onclick=()=>{shown+=40;renderFeed()};

/* 전자책 찾기: 도서관마다 따로 물어보고 먼저 온 곳부터 보여준다.
   login 이 있는 곳은 로그인해야 검색되는 곳이라 바로가기만 보여준다. */
const LIBS=[
  {id:"moj",name:"법무부 전자도서관"},
  {id:"suwon",name:"수원시 전자도서관"},
  {id:"nhi",name:"나라배움터 전자도서관"},
  {id:"goe",name:"경기도교육청 전자도서관"},
  {id:"ggl",name:"경기도서관 전자책"},
  {id:"semas",name:"소상공인 전자도서관"},
];
function libRow(l,state,r){
  const li=document.createElement("li");
  li.innerHTML='<div class="lh"><span class="ln"></span><span class="st"></span><a class="open" target="_blank" rel="noopener">열기 ›</a></div>';
  li.querySelector(".ln").textContent=l.name;
  const st=li.querySelector(".st"),op=li.querySelector(".open");
  const [txt,c]={wait:["찾는 중","var(--muted)"],yes:["있음 "+((r&&r.count)||"")+"권","var(--ok)"],no:["없음","var(--mlb)"],
    err:["확인 못함","var(--muted)"],login:["로그인해야 검색돼요","var(--muted)"]}[state];
  st.textContent=txt;st.style.setProperty("--c",c);
  const href=(r&&r.url)||l.login;
  if(href)op.href=href;else op.remove();
  for(const it of (r&&r.items)||[]){
    const a=document.createElement("a");a.className="bk";a.href=it.url;a.target="_blank";a.rel="noopener";
    a.textContent=it.title+" ";
    const sm=document.createElement("small");sm.textContent=[it.author,it.status].filter(Boolean).join(" · ");a.appendChild(sm);
    li.appendChild(a);
  }
  return li;
}
document.getElementById("ebookForm").onsubmit=e=>{
  e.preventDefault();
  const q=document.getElementById("ebookQ").value.trim(); if(!q)return;
  const ul=document.getElementById("libs"); ul.innerHTML=""; ul.hidden=false;
  for(const l of LIBS){
    const row=libRow(l,l.login?"login":"wait"); ul.appendChild(row);
    if(l.login||!API)continue;
    fetch(API+"/ebook?lib="+l.id+"&q="+encodeURIComponent(q)).then(r=>r.json()).then(r=>{
      if(document.getElementById("ebookQ").value.trim()!==q)return;
      row.replaceWith(libRow(l,r.error?"err":r.count?"yes":"no",r));
    }).catch(()=>{row.replaceWith(libRow(l,"err"))});
  }
};
renderFeed();
/* 바로 모으기 서버(Cloudflare Worker). 그 서버에서 열면 같은 주소의 /api, 아니면 아래 주소를 쓴다.
   서버가 없거나 실패하면 GitHub가 30분마다 저장하는 posts.json을 보여준다. */
const WORKER_URL="https://moa-board.copoon99.workers.dev";
const API=location.hostname.endsWith("workers.dev")?"/api":(WORKER_URL?WORKER_URL.replace(/\/$/,"")+"/api":"");
const FEED_IDS=["fm-realestate","dc-marvelsnap","dc-bh","dc-thesingularity","mlb-bullpen","dc-ai_utilize"];
function applyFeed(j){feedDocs=(j.boards||[]).filter(d=>(d.posts||[]).length||d.error);renderFeed()}
async function loadFeed(fresh){
  if(API){
    // 게시판마다 따로 불러서 먼저 도착한 게시판부터 보여준다
    const got={};
    const results=await Promise.all(FEED_IDS.map(async id=>{
      try{
        const r=await fetch(API+"?board="+id+(fresh?"&fresh=1":""),{cache:"no-store"});
        if(!r.ok){got[id]={id,name:id,error:"서버 응답 "+r.status,posts:[]};feedDocs=FEED_IDS.filter(k=>got[k]).map(k=>got[k]);renderFeed();return false}
        got[id]=await r.json();
        feedDocs=FEED_IDS.filter(k=>got[k]&&((got[k].posts||[]).length||got[k].error)).map(k=>got[k]);
        renderFeed(); return true;
      }catch(e){got[id]={id,name:id,error:"연결 실패",posts:[]};feedDocs=FEED_IDS.filter(k=>got[k]).map(k=>got[k]);renderFeed();return false}
    }));
    if(results.some(Boolean)) return true;
  }
  try{
    const r=await fetch("posts.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok) applyFeed(await r.json());
  }catch(e){}
  return false;
}
loadFeed();
setInterval(loadFeed,5*60000);

/* 새로고침: 최신 posts.json을 다시 읽고, GitHub에서 수집을 바로 돌릴 수 있는 링크를 보여준다.
   링크로 수집을 시작하면 결과가 올라올 때까지 3분 동안 15초마다 다시 읽는다. */
const RUN_URL="https://github.com/copoon99-create/moa-board/actions/workflows/scrape.yml";
let lastUpdated="", watching=0;
function note(html){const n=document.getElementById("refreshNote");n.hidden=!html;n.innerHTML=html||""}
async function fetchLatest(){
  const r=await fetch("posts.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return null;
  const j=await r.json(); feedDocs=(j.boards||[]).filter(d=>(d.posts||[]).length||d.error); renderFeed(); return j.updatedAt||"";
}
function watch(){
  clearInterval(watching); const start=lastUpdated, until=Date.now()+180000;
  note("GitHub에서 <b>Run workflow</b>를 누르면 1~2분 뒤 여기에 새 글이 자동으로 들어와요.");
  watching=setInterval(async()=>{
    let u; try{u=await fetchLatest()}catch(e){return}
    if(u&&u!==start){clearInterval(watching);lastUpdated=u;note("방금 새로 모았어요.");setTimeout(()=>note(""),5000)}
    else if(Date.now()>until){clearInterval(watching);note("")}
  },15000);
}
document.getElementById("refreshBtn").onclick=async()=>{
  const b=document.getElementById("refreshBtn"); b.disabled=true;
  if(API){
    note("게시판에서 바로 읽어오는 중이에요.");
    const ok=await loadFeed(true); b.disabled=false;
    if(ok){note("방금 새로 모았어요.");setTimeout(()=>note(""),4000);return}
    note("");
  }
  try{lastUpdated=(await fetchLatest())||lastUpdated}catch(e){}
  b.disabled=false;
  note('지금 바로 새로 모으려면 <a id="runLink" href="'+RUN_URL+'" target="_blank" rel="noopener">GitHub에서 수집 실행</a>을 눌러주세요.');
  document.getElementById("runLink").onclick=watch;
};
setInterval(renderFeed,60000);
