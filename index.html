<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모아게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* 한 줄 목록: 사이트별 색 칩 + 게시판 이름 + 주소, 엄지로 누르기 좋은 큰 행 */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1d2320; --muted:#68716c; --line:#dfe3df; --accent:#2f6f5e;
  --dc:#3b4890; --fm:#3d6fd8; --mlb:#c8462f;
  --display:"Gowun Dodum","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --card:#1d2220; --fg:#e8ece9; --muted:#9aa49f; --line:#2c3330; --accent:#6fc2a9;
  --dc:#8d98e6; --fm:#7fa6f2; --mlb:#f08a74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1d2220; --fg:#e8ece9; --muted:#9aa49f; --line:#2c3330; --accent:#6fc2a9;
  --dc:#8d98e6; --fm:#7fa6f2; --mlb:#f08a74; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:30px;font-weight:400;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li a{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:15px 16px;color:inherit;text-decoration:none}
li a:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.chip{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.name{font-weight:600;font-size:16px}
.url{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin-left:auto;color:var(--muted);flex:none}
form{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
form input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 -8px 2px}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;list-style:none;margin:0;padding:0;background:none;border:0;border-radius:0;overflow:visible}
.shortcuts li{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.shortcuts li a{flex-direction:column;gap:6px;padding:12px 6px;text-align:center}
.shortcuts .chip{width:34px;height:34px;font-size:12px}
.shortcuts .name{font-size:13px;font-weight:600;line-height:1.3;word-break:keep-all}
.ctrl{display:flex;gap:4px;flex:none;padding:4px 8px}
.shortcuts .ctrl{justify-content:center;padding:0 4px 8px}
.ctrl button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 8px;cursor:pointer}
.ctrl button:disabled{opacity:.35;cursor:default}
.ctrl .x{color:var(--mlb)}
form select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.feed li a{gap:10px;padding:12px 16px;align-items:flex-start}
.feed .badge{flex:none;font-size:11px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:3px 6px;margin-top:2px}
.feed .title{font-size:15px;line-height:1.4;word-break:break-all}
.feed .cm{color:var(--accent);font-weight:600;font-size:13px}
.feed .meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;color:var(--muted);font-size:14px;line-height:1.6;text-align:center}
.updated{color:var(--muted);font-size:12px;margin:-8px 0 0 2px}
.more{align-self:center}
.feedhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-8px}
.feedhead h2{margin:0 0 0 2px}
.refresh{display:inline-flex;align-items:center;gap:6px}
.refresh[disabled]{opacity:.6;cursor:default}
.refresh[disabled] .spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.refresh[disabled] .spin{animation:none}}
.note{font-size:13px;color:var(--muted);margin:-6px 0 0 2px;line-height:1.6}
.note a{color:var(--accent);font-weight:600}
.feed .badge{min-width:3.6em;text-align:center}
.foot{color:var(--muted);font-size:12px;text-align:center}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>모아게시판</h1>
      <p class="sub">바로가기 <span id="scount">9</span>곳 · 게시판 <span id="count">6</span>곳</p>
    </div>
    <button class="btn" id="editBtn" type="button">편집</button>
  </header>

  <h2>바로가기</h2>
  <ul class="shortcuts" id="slist"></ul>

  <div class="feedhead">
    <h2>최근 글</h2>
    <button class="btn refresh" id="refreshBtn" type="button"><span class="spin" aria-hidden="true">↻</span><span id="refreshLabel">새로고침</span></button>
  </div>
  <p class="note" id="refreshNote" hidden></p>
  <div class="tabs" id="tabs" role="toolbar" aria-label="게시판 고르기"></div>
  <p class="updated" id="updated" hidden></p>
  <p class="note" id="feedErr" hidden></p>
  <ul class="feed" id="feed" hidden></ul>
  <div class="empty" id="feedEmpty">게시판에서 최신 글을 불러오는 중이에요.</div>
  <button class="btn more" id="moreBtn" type="button" hidden>더 보기</button>

  <h2>게시판</h2>
  <ul id="list"></ul>

  <form id="addForm" hidden>
    <select id="newKind" aria-label="넣을 곳"><option value="boards">게시판</option><option value="shortcuts">바로가기</option></select>
    <input id="newName" placeholder="이름" required>
    <input id="newUrl" placeholder="https://..." type="url" required>
    <div class="row">
      <button class="btn" type="submit">추가</button>
      <button class="btn" type="button" id="resetBtn">처음 목록으로 되돌리기</button>
    </div>
  </form>

  <p class="foot">편집한 내용은 이 기기 브라우저에만 저장돼요.</p>
</div>

<script>
const DEFAULTS={
 shortcuts:[
  {name:"유튜브",url:"https://www.youtube.com/"},
  {name:"X",url:"https://x.com/"},
  {name:"우리의 식탁",url:"https://claude.ai/artifact/NvnyNs6LDAppHWA79MrQ1z"},
  {name:"스냅 덱",url:"https://snapcomplete.com/play/matches/decks"},
  {name:"PGR21",url:"https://www.pgr21.com/"},
  {name:"네이버 카페",url:"https://section.cafe.naver.com/ca-fe/home",app:"navercafe"},
  {name:"법무부 전자도서관",url:"https://moj.yes24library.com/default.asp"},
  {name:"수원시 도서관",url:"https://mob.suwonlib.go.kr/"},
  {name:"나라배움터 도서관",url:"https://ebook-nhi.mlss.co.kr/Kyobo_T3_Mobile/Web/Main/Ebook_Main.asp"}
 ],
 boards:[
  {name:"부동산",url:"https://m.fmkorea.com/realestate"},
  {name:"마블 스냅 갤러리",url:"https://m.dcinside.com/board/marvelsnap"},
  {name:"보호직 갤러리",url:"https://m.dcinside.com/board/bh"},
  {name:"특이점이 온다 갤러리",url:"https://m.dcinside.com/board/thesingularity"},
  {name:"불펜",url:"https://mlbpark.donga.com/mp/b.php?b=bullpen"},
  {name:"AI 활용 갤러리",url:"https://m.dcinside.com/board/ai_utilize"}
 ]};
const KEY="moa-board-v2";
const clone=()=>JSON.parse(JSON.stringify(DEFAULTS));
let data=load(), editing=false;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.boards)&&Array.isArray(s.shortcuts)){
  for(const x of s.shortcuts){if(x.url.includes("Kyobo_T3/Default.asp"))x.url="https://ebook-nhi.mlss.co.kr/Kyobo_T3_Mobile/Web/Main/Ebook_Main.asp"}
  for(const x of s.shortcuts){if(x.url.includes("cafe.naver.com"))x.app="navercafe"}
  for(const x of s.shortcuts) if(x.url.includes("our-table-kitchen")){x.name="우리의 식탁";x.url="https://claude.ai/artifact/NvnyNs6LDAppHWA79MrQ1z"}
  return s}}catch(e){}return clone()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const SITES=[["dcinside","디시","var(--dc)"],["fmkorea","펨코","var(--fm)"],["mlbpark","엠팍","var(--mlb)"],["youtube","▶","var(--mlb)"],["x.com","X","var(--fg)"],["naver","N","var(--accent)"],["pgr21","P","var(--fm)"],["snapcomplete","S","var(--dc)"]];
function site(u,name){
  for(const [k,t,c] of SITES) if(u.includes(k)) return{t,c};
  return{t:(name||"?").trim()[0].toUpperCase(),c:"var(--accent)"};
}
function item(kind,b,i,arr){
  const s=site(b.url,b.name),li=document.createElement("li"),a=document.createElement("a");
  a.href=b.url;a.target="_blank";a.rel="noopener";
  if(b.app==="navercafe"){ /* 네이버 카페 앱으로 열기. 안드로이드는 앱이 없으면 웹으로 */
    a.href=/Android/i.test(navigator.userAgent)
      ?"intent://#Intent;scheme=navercafe;package=com.nhn.android.navercafe;S.browser_fallback_url="+encodeURIComponent(b.url)+";end"
      :"navercafe://";
    a.removeAttribute("target");
  }
  a.innerHTML=kind==="boards"
    ?'<span class="chip"></span><span class="txt"><span class="name"></span><span class="url"></span></span><span class="go">›</span>'
    :'<span class="chip"></span><span class="name"></span>';
  const chip=a.querySelector(".chip");chip.textContent=s.t;chip.style.setProperty("--c",s.c);
  a.querySelector(".name").textContent=b.name;
  const u=a.querySelector(".url"); if(u)u.textContent=b.url.replace(/^https?:\/\//,"");
  li.appendChild(a);
  if(editing){
    const c=document.createElement("div");c.className="ctrl";
    const mk=(t,lab,fn,dis,cls)=>{const x=document.createElement("button");x.type="button";x.textContent=t;x.setAttribute("aria-label",lab);x.disabled=dis;if(cls)x.className=cls;x.onclick=fn;c.appendChild(x)};
    const mv=d=>{[arr[i],arr[i+d]]=[arr[i+d],arr[i]];save();render()};
    mk("↑",b.name+" 위로",()=>mv(-1),i===0);
    mk("↓",b.name+" 아래로",()=>mv(1),i===arr.length-1);
    mk("삭제",b.name+" 삭제",()=>{arr.splice(i,1);save();render()},false,"x");
    li.appendChild(c);
  }
  return li;
}
function render(){
  for(const [kind,id] of [["shortcuts","slist"],["boards","list"]]){
    const ul=document.getElementById(id);ul.innerHTML="";
    data[kind].forEach((b,i,arr)=>ul.appendChild(item(kind,b,i,arr)));
  }
  document.getElementById("count").textContent=data.boards.length;
  document.getElementById("scount").textContent=data.shortcuts.length;
  document.getElementById("addForm").hidden=!editing;
  document.getElementById("editBtn").textContent=editing?"완료":"편집";
}
document.getElementById("editBtn").onclick=()=>{editing=!editing;render()};
document.getElementById("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const k=document.getElementById("newKind").value,n=document.getElementById("newName"),u=document.getElementById("newUrl");
  data[k].push({name:n.value.trim(),url:u.value.trim()});n.value="";u.value="";save();render();
});
document.getElementById("resetBtn").onclick=()=>{data=clone();save();render()};
render();

/* 최근 글: posts.json(30분마다 GitHub Actions가 갱신)을 모아 시간순으로 */
let feedDocs=[], tab="all", shown=Infinity;
function ago(iso){
  const t=Date.parse(iso); if(!t) return "";
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return "방금"; if(m<60) return m+"분 전";
  const h=Math.floor(m/60); if(h<24) return h+"시간 전";
  const d=new Date(t); return (d.getMonth()+1)+"."+d.getDate();
}
function short(n){return (n||"").replace(/갤러리|\s/g,"").slice(0,3)}
function renderFeed(){
  const tabs=document.getElementById("tabs"); tabs.innerHTML="";
  const all=[["all","전체"]].concat(feedDocs.map(d=>[d.id,d.name||d.id]));
  for(const [k,n] of all){const b=document.createElement("button");b.type="button";b.className="tab";b.textContent=n;
    b.setAttribute("aria-pressed",String(tab===k));b.onclick=()=>{tab=k;renderFeed()};tabs.appendChild(b)}
  let posts=[];
  // 전체 보기는 모든 게시판의 글을 전부 시간순으로 보여준다
  for(const d of feedDocs) if(tab==="all"||tab===d.id){
    const own=(d.posts||[]).slice().sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));
    for(const p of own) posts.push(Object.assign({board:d.name||d.id,boardUrl:d.url||""},p));
  }
  posts.sort((a,b)=>(Date.parse(b.time)||0)-(Date.parse(a.time)||0));
  const ul=document.getElementById("feed"); ul.innerHTML="";
  posts.slice(0,shown).forEach(p=>{
    const s=site(p.boardUrl||p.url,p.board),li=document.createElement("li"),a=document.createElement("a");
    a.href=p.url;a.target="_blank";a.rel="noopener";
    a.innerHTML='<span class="badge"></span><span class="txt"><span class="title"></span><span class="meta"></span></span>';
    const bd=a.querySelector(".badge");bd.textContent=short(p.board);bd.style.setProperty("--c",s.c);bd.title=p.board;
    const ti=a.querySelector(".title");ti.textContent=p.title;
    if(p.comments){const c=document.createElement("span");c.className="cm";c.textContent=" ["+p.comments+"]";ti.appendChild(c)}
    a.querySelector(".meta").textContent=[p.board,p.author,ago(p.time)].filter(Boolean).join(" · ");
    li.appendChild(a);ul.appendChild(li);
  });
  ul.hidden=!posts.length;
  document.getElementById("feedEmpty").hidden=!!posts.length;
  document.getElementById("moreBtn").hidden=posts.length<=shown;
  const errs=feedDocs.filter(d=>d.error).map(d=>(d.name||d.id)+" ("+d.error+")");
  const fe=document.getElementById("feedErr"); fe.hidden=!errs.length; fe.textContent=errs.length?"불러오지 못한 게시판: "+errs.join(", "):"";
  tabs.hidden=!feedDocs.length;
  const up=feedDocs.map(d=>Date.parse(d.updatedAt)||0).reduce((a,b)=>Math.max(a,b),0);
  const ue=document.getElementById("updated"); ue.hidden=!up; if(up) ue.textContent="마지막으로 모은 시각: "+ago(new Date(up).toISOString());
}
document.getElementById("moreBtn").onclick=()=>{shown+=40;renderFeed()};
renderFeed();
/* 바로 모으기 서버(Cloudflare Worker). 그 서버에서 열면 같은 주소의 /api, 아니면 아래 주소를 쓴다.
   서버가 없거나 실패하면 GitHub가 30분마다 저장하는 posts.json을 보여준다. */
const WORKER_URL="https://moa-board.copoon99.workers.dev";
const API=location.hostname.endsWith("workers.dev")?"/api":(WORKER_URL?WORKER_URL.replace(/\/$/,"")+"/api":"");
const FEED_IDS=["fm-realestate","dc-marvelsnap","dc-bh","dc-thesingularity","mlb-bullpen","dc-ai_utilize"];
function applyFeed(j){feedDocs=(j.boards||[]).filter(d=>(d.posts||[]).length||d.error);renderFeed()}
async function loadFeed(fresh){
  if(API){
    // 게시판마다 따로 불러서 먼저 도착한 게시판부터 보여준다
    const got={};
    const results=await Promise.all(FEED_IDS.map(async id=>{
      try{
        const r=await fetch(API+"?board="+id+(fresh?"&fresh=1":""),{cache:"no-store"});
        if(!r.ok){got[id]={id,name:id,error:"서버 응답 "+r.status,posts:[]};feedDocs=FEED_IDS.filter(k=>got[k]).map(k=>got[k]);renderFeed();return false}
        got[id]=await r.json();
        feedDocs=FEED_IDS.filter(k=>got[k]&&((got[k].posts||[]).length||got[k].error)).map(k=>got[k]);
        renderFeed(); return true;
      }catch(e){got[id]={id,name:id,error:"연결 실패",posts:[]};feedDocs=FEED_IDS.filter(k=>got[k]).map(k=>got[k]);renderFeed();return false}
    }));
    if(results.some(Boolean)) return true;
  }
  try{
    const r=await fetch("posts.json?t="+Date.now(),{cache:"no-store"});
    if(r.ok) applyFeed(await r.json());
  }catch(e){}
  return false;
}
loadFeed();
setInterval(loadFeed,5*60000);

/* 새로고침: 최신 posts.json을 다시 읽고, GitHub에서 수집을 바로 돌릴 수 있는 링크를 보여준다.
   링크로 수집을 시작하면 결과가 올라올 때까지 3분 동안 15초마다 다시 읽는다. */
const RUN_URL="https://github.com/copoon99-create/moa-board/actions/workflows/scrape.yml";
let lastUpdated="", watching=0;
function note(html){const n=document.getElementById("refreshNote");n.hidden=!html;n.innerHTML=html||""}
async function fetchLatest(){
  const r=await fetch("posts.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return null;
  const j=await r.json(); feedDocs=(j.boards||[]).filter(d=>(d.posts||[]).length||d.error); renderFeed(); return j.updatedAt||"";
}
function watch(){
  clearInterval(watching); const start=lastUpdated, until=Date.now()+180000;
  note("GitHub에서 <b>Run workflow</b>를 누르면 1~2분 뒤 여기에 새 글이 자동으로 들어와요.");
  watching=setInterval(async()=>{
    let u; try{u=await fetchLatest()}catch(e){return}
    if(u&&u!==start){clearInterval(watching);lastUpdated=u;note("방금 새로 모았어요.");setTimeout(()=>note(""),5000)}
    else if(Date.now()>until){clearInterval(watching);note("")}
  },15000);
}
document.getElementById("refreshBtn").onclick=async()=>{
  const b=document.getElementById("refreshBtn"); b.disabled=true;
  if(API){
    note("게시판에서 바로 읽어오는 중이에요.");
    const ok=await loadFeed(true); b.disabled=false;
    if(ok){note("방금 새로 모았어요.");setTimeout(()=>note(""),4000);return}
    note("");
  }
  try{lastUpdated=(await fetchLatest())||lastUpdated}catch(e){}
  b.disabled=false;
  note('지금 바로 새로 모으려면 <a id="runLink" href="'+RUN_URL+'" target="_blank" rel="noopener">GitHub에서 수집 실행</a>을 눌러주세요.');
  document.getElementById("runLink").onclick=watch;
};
setInterval(renderFeed,60000);
</script>
</body>
</html>
