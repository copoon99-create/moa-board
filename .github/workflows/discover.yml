name: 전자도서관 조사

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 조사할 주소 (공백으로 구분)
        required: true
      needle:
        description: 찾을 글자
        required: false
      dump:
        description: 본문 앞부분 몇 글자 출력
        required: false

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/discover.mjs
        env:
          URLS: ${{ inputs.urls }}
          NEEDLE: ${{ inputs.needle }}
          DUMP: ${{ inputs.dump }}
