name: 바로 모으기 시험

on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/worker-test.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node worker/test.mjs
